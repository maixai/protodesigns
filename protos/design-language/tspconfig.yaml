# TypeSpec 工程配置:声明用哪些 emitter、各自把产物写到哪里。
# 这是"机制"层配置,各原型按自己的 targets / data 调整本文件。
# 本原型 data 为 local-first,只产出数据类型产物,不需要 OpenAPI 接口契约。
# 注意:@typespec/http 是库(在 .tsp 里 import),不是 emitter,不能列在此处。
emit:
  - "@typespec/json-schema"

options:
  # 数据类型产物:作为各端类型生成的输入(JSON Schema 比 OpenAPI 更适合出"裸类型")。
  "@typespec/json-schema":
    emitter-output-dir: "{project-root}/contracts/generated/schema"
